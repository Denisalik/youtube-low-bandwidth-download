[project]
name = "youtube-low-bandwidth-download-application"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "sqlmodel>=0.0.42",
    "yt-dlp>=2026.8.19",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (сортировка импортов)
    "UP",   # pyupgrade (современный синтаксис)
    "B",    # flake8-bugbear (типичные баги)
    "ASYNC",# правила для async-кода — пригодится для FastAPI
]