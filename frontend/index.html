<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D</title>
    <style>
      * {
        box-sizing: border-box;
        font-family: system-ui, sans-serif;
      }
      body {
        max-width: 600px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1rem;
        flex-wrap: wrap;
      }
      input,
      select,
      button {
        padding: 0.5rem;
        border: 1px solid #ccc;
        border-radius: 3px;
        font-size: 0.875rem;
      }
      input {
        flex: 1;
        min-width: 180px;
      }
      button {
        background: #06c;
        color: #fff;
        border-color: #06c;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        background: #c60;
        /* etc. */
      }
      #s {
        color: #666;
        font-size: 0.875rem;
        margin: 0.25rem 0;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem 0;
        border-bottom: 1px solid #ddd;
        gap: 1rem;
      }
      .u {
        word-break: break-all;
        font-size: 0.875rem;
        flex: 1;
      }
      .k {
        word-break: break-all;
        font-size: 1rem;
      }
      .n {
        word-break: break-all;
        font-size: 0.875rem;
      }
      .m {
        font-size: 0.75rem;
        color: #666;
      }
      a {
        color: #06c;
        text-decoration: none;
        font-size: 0.875rem;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <h1>Downloader</h1>
    <div class="row">
      <input id="u" placeholder="Paste URL" type="text" />
      <input id="o" placeholder="Username" type="text" />
      <input id="p" placeholder="Password" type="password" />
      <button id="a">Add</button>
      <button id="r">Reload</button>
    </div>
    <p id="s"></p>
    <ul id="l"></ul>
    <script>
      const u = document.getElementById("u");
      const l = document.getElementById("l");
      const s = document.getElementById("s");

      const o = document.getElementById("o");
      const p = document.getElementById("p");

      function getAuthBasic() {
        const username = o.value;
        const password = p.value;
        const credentials = btoa(username + ':' + password)
        return "Basic " + credentials;
      }

      async function load() {
        s.textContent = "Loading...";
        try {
          const r = await fetch("/api/files", {
              method: "GET",
              headers: {
                "Content-Type": "application/json",
                "Authorization": getAuthBasic(),
              },
          });
          if (!r.ok) throw new Error("HTTP " + r.status);
          const d = await r.json();
          render(d);
        } catch (e) {
          s.textContent = "Error: " + e.message;
        }
      }

      function render(items) {
        l.innerHTML = "";
        if (!items || !items.length) {
          s.textContent = "No items.";
          return;
        }
        if (items.length === 1) s.textContent = "1 item";
        else {
          s.textContent = items.length + " items";
        }
        items.forEach((x) => {
          const downloaded = x.state === "end";

          const li = document.createElement("li");
          
          const container = document.createElement("div");
          container.className = "u";
          
          const div = document.createElement("div");
          div.className = "k";
          div.textContent = downloaded ? x.channel_name : "—";
          
          const div2 = document.createElement("div");
          div2.className = "n";
          div2.textContent = downloaded ? x.name : "—";
          
          const div3 = document.createElement("div");
          div3.className = "n";
          div3.textContent = downloaded ? x.duration : "—";
          
          const meta = document.createElement("div");
          meta.className = "m";
          meta.textContent = x.url;
          
          const meta2 = document.createElement("div");
          meta2.className = "m";
          if (x.state !== 'get' && x.state !== 'end'){
            meta2.textContent = "File state: " + x.state;
          } else {
            meta2.textContent = downloaded
            ? (x.size / 1024 / 1024).toFixed(2) + " MB"
            : "—";
          }
          
          const meta3 = document.createElement("div");
          meta3.className = "m";
          meta3.textContent = downloaded ? x.format : "—";

          container.appendChild(div);
          container.appendChild(div2);
          container.appendChild(div3);
          container.appendChild(meta);
          
          container.appendChild(document.createElement("br"));
          
          container.appendChild(meta2);
          container.appendChild(meta3);
          
          li.appendChild(container);
          
          if (downloaded) {
            const a = document.createElement("a");
            a.href = "/files/" + encodeURIComponent(x.file_name);
            a.download = x.file_name;
            a.textContent = "Download";
            li.appendChild(a);
          } else {
            const e = document.createElement("select");
            
            const o1 = document.createElement("option");
            o1.textContent = "360";
            
            const o2 = document.createElement("option");
            o2.textContent = "720";
            
            const o3 = document.createElement("option");
            o3.textContent = "audio";
            o3.selected = true;
            
            e.appendChild(o1);
            e.appendChild(o2);
            e.appendChild(o3);
            
            const b = document.createElement("button");
            b.href = "/files/" + encodeURIComponent(x.file_name);
            b.textContent = "Download";
            b.onclick = async () => {
              b.disabled = true;
              const r = await fetch(`/api/files/${x.id}/download/${e.value}`, {
                method: "PUT",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": getAuthBasic(),
                },
              });
            };
            
            li.appendChild(e);
            li.appendChild(b);
          }
          l.appendChild(li);
        });
      }

      document.getElementById("a").onclick = async () => {
        const v = u.value.trim();
        
        if (!v) {
          s.textContent = "Enter URL";
          return;
        }
        
        s.textContent = "Sending...";
        
        try {
          const r = await fetch("/api/files", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": getAuthBasic(),
            },
            body: JSON.stringify({ url: v }),
          });
          if (!r.ok) throw new Error("HTTP " + r.status);
          
          u.value = "";
          
          load();
        } catch (e) {
          s.textContent = "Error: " + e.message;
        }
      };

      document.getElementById("r").onclick = async () => {
        s.textContent = "Sending...";
        load();
        const bs = document.querySelectorAll('button');
        bs.forEach(b => {b.disabled = false;});
      };
    </script>
  </body>
</html>
