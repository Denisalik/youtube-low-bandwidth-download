events {
    worker_connections 1024;
}
stream {
    map $ssl_preread_server_name $tls_backend {
        www.linux.org    xray;
        default          web;
    }

    upstream xray { server 127.0.0.1:1443; }
    upstream web  { server 127.0.0.1:8443; }

    server {
        listen 443;
        proxy_pass $tls_backend;
        ssl_preread on;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Compression for the tiny HTML/JSON only
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 128;

    # Critical for 10 kb/s: do not drop slow downloads
    send_timeout 600s;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name yout-low-bandwidth-download-app.duckdns.org www.yout-low-bandwidth-download-app.duckdns.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 127.0.0.1:8443 ssl;
        http2 on;
        listen 443 quic reuseport;
        http3 on;
        server_name yout-low-bandwidth-download-app.duckdns.org www.yout-low-bandwidth-download-app.duckdns.org;

        ssl_certificate     /etc/letsencrypt/live/yout-low-bandwidth-download-app.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yout-low-bandwidth-download-app.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;

        # 1. Frontend: single HTML
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
        }

        # 2. API: proxy to FastAPI
        location /api/ {

            limit_except GET {
                # Non-GET requests still require auth
                auth_basic "Restricted";
                auth_basic_user_file /etc/nginx/secrets/.htpasswd;
            }
            
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_read_timeout 300s;
        }

        # 3. Files: served directly by nginx
        location /files/ {

            alias /data/files/;
            autoindex off;

            # Essential for slow/unstable links
            add_header Accept-Ranges bytes always;
            gzip_disable "range";
            
            sendfile on;
            tcp_nopush on;
            tcp_nodelay on;
        }
    }
}