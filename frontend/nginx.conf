events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Compression for the tiny HTML/JSON only
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 128;

    # Critical for 10 kb/s: do not drop slow downloads
    send_timeout 600s;
    keepalive_timeout 65;

    server {
        listen 80;
        http2 on;
        # listen 443 ssl;
        # listen 443 quic reuseport;  # HTTP/3
        # server_name yout-low-bandwidth-download-app.duckdns.org www.yout-low-bandwidth-download-app.duckdns.org

        # 1. Frontend: single HTML
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
        }

        # 2. API: proxy to FastAPI
        location /api/ {
            # satisfy any;
            # auth_basic "Restricted";
            # auth_basic_user_file /etc/nginx/secrets/.htpasswd;

            limit_except GET {
                # Non-GET requests still require auth
                auth_basic "Restricted";
                auth_basic_user_file /etc/nginx/secrets/.htpasswd;
            }
            
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_read_timeout 300s;
        }

        # 3. Files: served directly by nginx
        location /files/ {

            alias /data/files/;
            autoindex off;

            # Essential for slow/unstable links
            add_header Accept-Ranges bytes always;
            gzip_disable "range";
            
            sendfile on;
            tcp_nopush on;
            tcp_nodelay on;
        }
    }
}